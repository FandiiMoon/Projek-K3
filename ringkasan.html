<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ringkasan Materi — K3 QUEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary':'#002530','primary-container':'#193B46','secondary':'#396662','secondary-fixed':'#BCECE7','surface':'#F4FAFE','surface-container-lowest':'#ffffff','surface-container-low':'#EEF4F8','surface-container':'#E9EFF3','on-surface':'#161C1F','on-surface-variant':'#41484B','outline-variant':'#C1C7CB','correct':'#23866D','correct-bg':'#D8F0E8'},fontFamily:{sans:['Inter'],display:['Plus Jakarta Sans']},borderRadius:{card:'14px',btn:'10px'},boxShadow:{card:'0 1px 4px rgba(23,43,52,0.06),0 4px 16px rgba(23,43,52,0.04)',header:'0 1px 8px rgba(23,43,52,0.05)'}}}}
  </script>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
<header id="app-header" class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-header border-b border-outline-variant/30"></header>
<div class="h-16"></div><div id="app-breadcrumb"></div>
<main class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="font-display text-3xl font-bold text-primary mb-2">Ringkasan Belajar</h1>
  <p class="text-on-surface-variant mb-6">Status penyelesaian materi K3 Anda. Lengkapi semua modul sebelum memulai kuis.</p>
  <div class="grid gap-4 md:grid-cols-2 mb-8" id="summaryGrid"></div>
  <div class="flex justify-center" id="quizCta"></div>
</main>
<footer id="app-footer" class="bg-surface-container-low border-t border-outline-variant/30"></footer>
<script src="assets/js/k3.js"></script>
<script>
  if (!K3.sudahIdentitas()) K3.redirect('identitas.html');
  renderHeader('materi');
  renderFooter();
  renderBreadcrumb([{label:'Ringkasan Materi',href:null}]);

  const materiList = [
    {slug:'ergonomi', title:'Ergonomi dan Posisi Kerja', href:'materi/ergonomi.html'},
    {slug:'kesehatan-mata', title:'Kesehatan Mata', href:'materi/kesehatan-mata.html'},
    {slug:'keselamatan-listrik', title:'Keselamatan Listrik dan Perangkat', href:'materi/keselamatan-listrik.html'},
    {slug:'kesehatan-mental', title:'Kesehatan Mental dan Manajemen Stres', href:'materi/kesehatan-mental.html'},
  ];

  const progress = K3.getProgress();
  document.getElementById('summaryGrid').innerHTML = materiList.map(m => {
    const selesai = progress[m.slug];
    return `
    <div class="card p-5 flex flex-col justify-between ${selesai ? 'bg-correct-bg/30 border-correct/30' : ''}">
      <div>
        <h3 class="font-display font-bold text-sm text-primary-container mb-2">${m.title}</h3>
        <span class="badge ${selesai ? 'badge-mint' : 'badge-gray'}">${selesai ? '✓ Selesai' : 'Belum dipelajari'}</span>
      </div>
      <a href="${m.href}" class="mt-3 btn ${selesai ? 'btn-secondary' : 'btn-primary'} btn-sm">
        ${selesai ? 'Baca Ulang' : 'Pelajari'}
        <span class="material-symbols-outlined icon-sm">arrow_forward</span>
      </a>
    </div>`;
  }).join('');

  const ctaDiv = document.getElementById('quizCta');
  if (K3.semuaSelesai()) {
    ctaDiv.innerHTML = `<a href="kuis.html" class="btn btn-primary btn-lg"><span class="material-symbols-outlined icon-md">quiz</span>Mulai Kuis</a>`;
  } else {
    ctaDiv.innerHTML = `<button class="btn btn-secondary btn-lg" disabled><span class="material-symbols-outlined icon-md">lock</span>Selesaikan Semua Materi untuk Membuka Kuis</button>`;
  }
</script>
</body>
</html>
