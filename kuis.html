<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis K3 — K3 QUEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary':'#002530','primary-container':'#193B46','secondary':'#396662','secondary-fixed':'#BCECE7','surface':'#F4FAFE','surface-container-lowest':'#ffffff','surface-container-low':'#EEF4F8','surface-container':'#E9EFF3','on-surface':'#161C1F','on-surface-variant':'#41484B','outline-variant':'#C1C7CB'},fontFamily:{sans:['Inter'],display:['Plus Jakarta Sans']},borderRadius:{card:'14px',btn:'10px'},boxShadow:{card:'0 1px 4px rgba(23,43,52,0.06),0 4px 16px rgba(23,43,52,0.04)',header:'0 1px 8px rgba(23,43,52,0.05)'}}}}
  </script>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
<header id="app-header" class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-header border-b border-outline-variant/30"></header>
<div class="h-16"></div><div id="app-breadcrumb"></div>

<!-- Not-ready block -->
<div id="notReady" class="hidden max-w-2xl mx-auto px-4 sm:px-6 py-10">
  <div class="card p-6 text-center">
    <h2 class="font-display text-2xl font-bold text-primary mb-4">Kuis belum dapat diakses</h2>
    <p class="text-on-surface-variant mb-6">Anda harus menyelesaikan semua materi terlebih dahulu.</p>
    <a href="ringkasan.html" class="btn btn-primary btn-lg"><span class="material-symbols-outlined icon-md">summarize</span>Lihat Ringkasan Materi</a>
  </div>
</div>

<!-- Quiz block -->
<main id="quizMain" class="hidden max-w-3xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="font-display text-3xl font-bold text-primary mb-2">Kuis K3 – Evaluasi Pengetahuan</h1>
  <p class="text-on-surface-variant mb-8">Jawab semua pertanyaan berikut dengan teliti.</p>
  <div id="quizContainer" class="space-y-6"></div>
  <div class="flex justify-center mt-8">
    <button id="submitBtn" onclick="submitKuis()" class="btn btn-primary btn-lg">
      <span class="material-symbols-outlined icon-md">send</span>
      Kirim Jawaban
    </button>
  </div>
  <p id="submitError" class="text-center text-wrong text-sm mt-3 hidden">⚠️ Harap jawab semua pertanyaan sebelum mengirim.</p>
</main>

<footer id="app-footer" class="bg-surface-container-low border-t border-outline-variant/30"></footer>
<script src="assets/js/k3.js"></script>
<script>
  if (!K3.sudahIdentitas()) K3.redirect('identitas.html');
  renderHeader('');
  renderFooter();
  renderBreadcrumb([{label:'Kuis K3', href:null}]);

  if (!K3.semuaSelesai()) {
    document.getElementById('notReady').classList.remove('hidden');
  } else {
    document.getElementById('quizMain').classList.remove('hidden');
    const soal = K3.getSoal();
    document.getElementById('quizContainer').innerHTML = soal.map(s => `
      <div class="card p-5">
        <div class="flex items-center gap-2 mb-2">
          <span class="badge badge-primary">No. ${s.no}</span>
          <span class="badge badge-teal">${s.kategori}</span>
        </div>
        <p class="font-semibold text-on-surface mb-3">${s.soal}</p>
        <div class="space-y-2">
          ${Object.entries(s.opsi).map(([k, v]) => `
            <label class="quiz-option" onclick="selectOption(this, ${s.no})">
              <input type="radio" name="q${s.no}" value="${k}" class="sr-only"/>
              <span class="option-key">${k}</span>
              <span>${v}</span>
            </label>`).join('')}
        </div>
      </div>`).join('');
  }

  function selectOption(el, no) {
    document.querySelectorAll(`[name="q${no}"]`).forEach(r => r.closest('.quiz-option').classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
  }

  function submitKuis() {
    const soal = K3.getSoal();
    let allAnswered = true;
    soal.forEach(s => { if (!document.querySelector(`[name="q${s.no}"]:checked`)) allAnswered = false; });
    if (!allAnswered) { document.getElementById('submitError').classList.remove('hidden'); return; }
    document.getElementById('submitError').classList.add('hidden');

    let score = 0;
    const details = soal.map(s => {
      const jawaban = document.querySelector(`[name="q${s.no}"]:checked`)?.value || null;
      const isCorrect = jawaban === s.jawaban;
      if (isCorrect) score++;
      return { no: s.no, kategori: s.kategori, soal: s.soal, jawaban, benar: s.jawaban, isCorrect, penjelasan: s.penjelasan, opsi: s.opsi };
    });
    K3.setHasil({ score, total: soal.length, details });
    K3.redirect('hasil.html');
  }
</script>
</body>
</html>
