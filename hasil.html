<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hasil Kuis — K3 QUEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{'primary':'#002530','primary-container':'#193B46','secondary':'#396662','secondary-fixed':'#BCECE7','surface':'#F4FAFE','surface-container-lowest':'#ffffff','surface-container-low':'#EEF4F8','surface-container':'#E9EFF3','on-surface':'#161C1F','on-surface-variant':'#41484B','outline-variant':'#C1C7CB','correct':'#23866D','correct-bg':'#D8F0E8','wrong':'#D9535D','wrong-bg':'#FFEAEB'},fontFamily:{sans:['Inter'],display:['Plus Jakarta Sans']},borderRadius:{card:'14px',btn:'10px'},boxShadow:{card:'0 1px 4px rgba(23,43,52,0.06),0 4px 16px rgba(23,43,52,0.04)',header:'0 1px 8px rgba(23,43,52,0.05)'}}}}
  </script>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
<header id="app-header" class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-md shadow-header border-b border-outline-variant/30"></header>
<div class="h-16"></div><div id="app-breadcrumb"></div>
<main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
  <h1 class="font-display text-3xl font-bold text-primary mb-6">Hasil Kuis K3</h1>

  <!-- Score card -->
  <div class="card p-8 mb-8 text-center fade-up" id="scoreCard"></div>

  <!-- Review -->
  <h2 class="font-display text-xl font-bold text-primary-container mb-4">Ulasan Jawaban</h2>
  <div id="reviewContainer" class="space-y-4 mb-8"></div>

  <div class="flex flex-col sm:flex-row justify-center gap-3">
    <a href="ringkasan.html" class="btn btn-primary btn-lg"><span class="material-symbols-outlined icon-sm">summarize</span>Ringkasan Materi</a>
    <a href="kuis.html" class="btn btn-secondary btn-lg"><span class="material-symbols-outlined icon-sm">replay</span>Ulangi Kuis</a>
  </div>
</main>
<footer id="app-footer" class="bg-surface-container-low border-t border-outline-variant/30"></footer>
<script src="assets/js/k3.js"></script>
<script>
  if (!K3.sudahIdentitas()) K3.redirect('identitas.html');
  renderHeader('');
  renderFooter();
  renderBreadcrumb([{label:'Hasil Kuis', href:null}]);

  const hasil = K3.getHasil();
  if (!hasil) { K3.redirect('kuis.html'); }

  const { score, total, details } = hasil;
  const pct = Math.round((score / total) * 100);
  const { nama, kelas } = K3.getPeserta();

  let grade, gradeColor;
  if (pct >= 80) { grade = 'Sangat Baik 🎉'; gradeColor = '#23866D'; }
  else if (pct >= 60) { grade = 'Cukup Baik 👍'; gradeColor = '#396662'; }
  else { grade = 'Perlu Belajar Lagi 📚'; gradeColor = '#D9535D'; }

  document.getElementById('scoreCard').innerHTML = `
    <div class="score-ring-wrap mx-auto mb-4">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="55" stroke="#E9EFF3" stroke-width="12" fill="none"/>
        <circle cx="65" cy="65" r="55" stroke="${gradeColor}" stroke-width="12" fill="none"
          stroke-dasharray="${2 * Math.PI * 55}" stroke-dashoffset="${2 * Math.PI * 55 * (1 - pct/100)}"
          stroke-linecap="round" style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="score-ring-center">
        <span class="font-display font-extrabold text-3xl" style="color:${gradeColor}">${pct}%</span>
        <span class="text-xs text-on-surface-variant">${score}/${total} Benar</span>
      </div>
    </div>
    <h2 class="font-display font-bold text-xl text-primary mb-1">${grade}</h2>
    <p class="text-on-surface-variant text-sm">${nama} · ${kelas}</p>`;

  document.getElementById('reviewContainer').innerHTML = details.map(d => `
    <div class="card p-5 ${d.isCorrect ? 'border-correct/30 bg-correct-bg/20' : 'border-wrong/30 bg-wrong-bg/20'}">
      <div class="flex items-center gap-2 mb-2">
        <span class="badge ${d.isCorrect ? 'badge-mint' : 'badge-red'}">${d.isCorrect ? '✓ Benar' : '✗ Salah'}</span>
        <span class="badge badge-gray">${d.kategori}</span>
        <span class="text-xs text-on-surface-variant">No. ${d.no}</span>
      </div>
      <p class="font-semibold text-on-surface mb-2 text-sm">${d.soal}</p>
      <div class="text-sm space-y-1">
        <p><span class="text-on-surface-variant">Jawaban Anda:</span> <strong class="${d.isCorrect ? 'text-correct' : 'text-wrong'}">${d.jawaban || '-'} – ${d.opsi[d.jawaban] || 'Tidak dijawab'}</strong></p>
        ${!d.isCorrect ? `<p><span class="text-on-surface-variant">Jawaban Benar:</span> <strong class="text-correct">${d.benar} – ${d.opsi[d.benar]}</strong></p>` : ''}
        <p class="mt-2 text-on-surface-variant text-xs leading-relaxed bg-surface-container rounded-lg p-3">💡 ${d.penjelasan}</p>
      </div>
    </div>`).join('');
</script>
</body>
</html>
